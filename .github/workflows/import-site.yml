name: Import current Métrikas site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source and finalize repository
        shell: bash
        run: |
          unzip -o web-metrikas-import.zip
          rm -f web-metrikas-import.zip
          rm -f .github/workflows/import-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import current Métrikas site source"
          git push
